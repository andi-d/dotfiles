# ==============================================================================
# HYPRLOCK CONFIGURATION - Catppuccin Sunset / Glassmorphic Aesthetic
# ==============================================================================

# Variables & Color Palette
$font = JetBrains Mono, DejaVu Sans Mono, Monospace

$accent = rgba(203, 166, 247, 1.0)        # Mauve
$accent_alt = rgba(137, 180, 250, 1.0)    # Sapphire
$accent_pink = rgba(242, 205, 205, 1.0)   # Flamingo

$bg_card = rgba(17, 17, 27, 0.55)
$border_card = rgba(203, 166, 247, 0.35)

$text_main = rgba(205, 214, 244, 1.0)
$text_sub = rgba(166, 173, 200, 0.85)

$green = rgba(166, 227, 161, 0.85)
$red = rgba(243, 139, 168, 0.85)
$peach = rgba(250, 179, 135, 0.85)

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
    text_trim = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1

    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeInOutCubic
    animation = inputFieldDots, 1, 3, easeOutQuint
    animation = inputFieldColors, 1, 4, easeOutQuint
    animation = inputFieldWidth, 1, 4, easeOutQuint
}

# BACKGROUND (Blurred screenshot with glassmorphic tint)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.17
    vibrancy_darkness = 0.0
    color = rgba(17, 17, 27, 1.0)
}

# CENTRAL GLASS CARD
shape {
    monitor =
    size = 400, 460
    color = $bg_card
    rounding = 28
    border_size = 2
    border_color = $border_card
    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_boost = 1.2
}

# TIME (Large Clock)
label {
    monitor =
    text = $TIME
    color = $accent
    font_size = 64
    font_family = $font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text_sub
    font_size = 16
    font_family = $font
    position = 0, 95
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# USER AVATAR / ICON
label {
    monitor =
    text = <span foreground='##cba6f7'>󰀉</span>
    font_size = 44
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# GREETING
label {
    monitor =
    text = Welcome back, <span foreground='##89b4fa'>$USER</span>
    color = $text_main
    font_size = 16
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    
    outer_color = rgba(203, 166, 247, 0.8) rgba(137, 180, 250, 0.8) 45deg
    inner_color = rgba(30, 30, 46, 0.65)
    font_color = $text_main
    fade_on_empty = false
    rounding = -1

    placeholder_text = <span foreground="##a6adc8">󰌾 Enter Password...</span>
    fail_text = <span foreground="##f38ba8"><i>$PAMFAIL</i></span>
    
    check_color = $green rgba(137, 180, 250, 0.85) 120deg
    fail_color = $red rgba(250, 179, 135, 0.85) 40deg
    capslock_color = $peach
    
    fail_timeout = 2000
    fail_transition = 300

    position = 0, -85
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# KEYBOARD LAYOUT INDICATOR
label {
    monitor =
    text = <span foreground='##89b4fa'>󰌌</span>  $LAYOUT
    color = $text_sub
    font_size = 12
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# NOW PLAYING MEDIA WIDGET (Bottom Center)
label {
    monitor =
    text = cmd[update:1000] playerctl metadata --format '󰎈  {{title}} - {{artist}}' 2>/dev/null || echo ""
    color = rgba(180, 190, 254, 0.75)
    font_size = 13
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# SYSTEM UPTIME WIDGET (Bottom Left)
label {
    monitor =
    text = cmd[update:60000] echo "󰅐  $(uptime -p | sed 's/up //')"
    color = rgba(147, 153, 178, 0.6)
    font_size = 12
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
}
